<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="origin" />
  <title>Portfolio Map — SPN &amp; SFT</title>
  <link rel="dns-prefetch" href="https://tiles.openfreemap.org" />
  <link rel="dns-prefetch" href="https://www.google.com" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="title-row">
        <div>
          <h1>Portfolio Map</h1>
          <span class="title-meta" id="headerSummary">308 Companies · 590 Sites</span>
        </div>
        <button class="reset-link" id="btnResetSidebar" title="Reset search, filters and map">Reset</button>
      </div>

      <div class="search-wrap">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search company, rig, mine, city..."
          autocomplete="off"
        />
        <button class="clear-search" id="btnClearSearch" title="Clear search" hidden>&times;</button>
      </div>

      <div class="filters-row">
        <select id="countrySelect" class="clean-select">
          <option value="ALL">All Regions</option>
          <option value="Norge">Norway</option>
          <option value="Sverige">Sweden</option>
          <option value="Finland">Finland</option>
          <option value="Danmark">Denmark</option>
          <option value="Island">Iceland</option>
          <option value="GLOBAL">Global (Brazil, Africa, etc.)</option>
          <option disabled>──────────</option>
          <option value="FUND_SPN">SPN Fund Only</option>
          <option value="FUND_SFT">SFT Fund Only</option>
        </select>

        <select id="typeSelect" class="clean-select">
          <option value="all">All Types</option>
          <option value="hqs_only">HQs Only</option>
          <option value="oilgas">Oil &amp; Gas Rigs</option>
          <option value="fish">Fish Farms</option>
          <option value="mills">Mines &amp; Smelters</option>
          <option value="factories">Factories &amp; Defense</option>
          <option value="datacenters">Data Centers</option>
          <option value="distribution">Offices &amp; Logistics</option>
          <option value="pharma">Pharma &amp; Labs</option>
        </select>
      </div>
    </div>

    <div class="segmented-tabs">
      <button class="seg-btn active" id="tabCompanies">
        Companies <span class="tab-count" id="tabCountCompanies">308</span>
      </button>
      <button class="seg-btn" id="tabFacilities">
        Sites <span class="tab-count" id="tabCountFacilities">590</span>
      </button>
    </div>

    <div class="list-container" id="entityList"></div>
  </aside>

  <main class="map-stage">
    <div id="map"></div>

    <div class="map-toolbar">
      <div class="toolbar-group">
        <button class="tool-btn active" id="btnToggleLogos" title="Toggle company favicons on map">Logos</button>
        <button class="tool-btn active" id="btnToggleSites" title="Toggle operational sites (rigs, farms, mines)">Sites</button>
        <button class="tool-btn" id="btnToggleLinks" title="Toggle all HQ-to-site connection lines">Links</button>
        <button class="tool-btn" id="btnToggle3d" title="Toggle 3D buildings">3D</button>
      </div>
      <div class="toolbar-group">
        <button class="tool-btn active" data-basemap="liberty">Map</button>
        <button class="tool-btn" data-basemap="satellite">Satellite</button>
        <button class="tool-btn" id="btnResetView">Reset</button>
      </div>
    </div>

    <div class="detail-sheet" id="inspectorCard"></div>
  </main>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="data/hq_companies_part1.js"></script>
  <script src="data/hq_companies_part2.js"></script>
  <script src="data/hq_companies_spn.js"></script>
  <script src="data/facilities_expansion.js" defer></script>
  <script src="data/facilities_expansion_part2.js" defer></script>
  <script src="data/facilities_expansion_part3.js" defer></script>
  <script src="data/facilities_expansion_part4.js" defer></script>
  <script src="data/facilities_expansion_part5.js" defer></script>
  <script src="data/facilities_expansion_part6.js" defer></script>
  <script src="data/facilities_expansion_part7.js" defer></script>
  <script src="data/facilities_expansion_part8.js" defer></script>
  <script src="data/facilities_agy_batch1.js" defer></script>
  <script src="data/company_intelligence.js" defer></script>
  <script src="data/company_intelligence_part2.js" defer></script>
  <script src="data/company_intelligence_part3.js" defer></script>
  <script src="data/facilities_grok_batch1.js" defer></script>
  <script src="app.js"></script>
</body>
</html>
