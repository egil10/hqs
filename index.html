<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="origin" />
  <title>Portfolio Map</title>
  <link rel="dns-prefetch" href="https://tiles.openfreemap.org" />
  <link rel="dns-prefetch" href="https://www.google.com" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="sb-head">
      <div class="search-wrap">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search"
          aria-label="Search"
          autocomplete="off"
          spellcheck="false"
        />
        <kbd class="search-kbd" id="searchKbd">/</kbd>
        <button class="clear-search" id="btnClearSearch" title="Clear search" hidden>&times;</button>
      </div>
      <button class="filter-btn" id="btnFilter" aria-expanded="false" aria-controls="filterPanel">
        Filter<span class="filter-count" id="filterCount" hidden></span>
      </button>

      <div class="filter-panel" id="filterPanel" hidden>
        <div class="fp-group">
          <div class="fp-label">View</div>
          <div class="seg seg-full" id="viewBar">
            <button class="seg-btn active" data-view="companies">List</button>
            <button class="seg-btn" data-view="grid">Logos</button>
            <button class="seg-btn" data-view="facilities">Sites</button>
          </div>
        </div>
        <div class="fp-group">
          <div class="fp-label">Region</div>
          <div class="seg seg-full" id="regionBar">
            <button class="seg-btn active" data-region="ALL">All</button>
            <button class="seg-btn" data-region="Norge" title="Norway">NO</button>
            <button class="seg-btn" data-region="Sverige" title="Sweden">SE</button>
            <button class="seg-btn" data-region="Danmark" title="Denmark">DK</button>
            <button class="seg-btn" data-region="Finland" title="Finland">FI</button>
            <button class="seg-btn" data-region="Island" title="Iceland">IS</button>
            <button class="seg-btn" data-region="GLOBAL" title="Sites outside the Nordics">Intl</button>
          </div>
        </div>
        <div class="fp-group">
          <div class="fp-label">Site type</div>
          <div class="chips" id="typeBar">
            <button class="chip active" data-type="all">All</button>
            <button class="chip" data-type="hqs_only" title="Headquarters only, no sites">HQs</button>
            <button class="chip" data-type="oilgas" style="--c:#dc2626">Energy</button>
            <button class="chip" data-type="fish" style="--c:#0284c7">Seafood</button>
            <button class="chip" data-type="mills" style="--c:#d97706">Mining</button>
            <button class="chip" data-type="factories" style="--c:#2563eb">Factory</button>
            <button class="chip" data-type="datacenters" style="--c:#7c3aed">Data</button>
            <button class="chip" data-type="distribution" style="--c:#64748b">Office</button>
            <button class="chip" data-type="pharma" style="--c:#059669">Lab</button>
          </div>
        </div>
        <div class="fp-group">
          <div class="fp-label">Sort</div>
          <div class="chips" id="sortBar">
            <button class="chip active" data-sort="value_desc">Holding</button>
            <button class="chip" data-sort="mcap_desc">Market cap</button>
            <button class="chip" data-sort="chg1m_desc">1M</button>
            <button class="chip" data-sort="sites_desc">Sites</button>
            <button class="chip" data-sort="name_asc">A–Z</button>
          </div>
        </div>
        <button class="text-btn fp-reset" id="btnReset">Reset everything</button>
      </div>
    </div>

    <div class="list-container" id="entityList"></div>
  </aside>

  <main class="map-stage">
    <div id="map"></div>

    <div class="map-toolbar">
      <div class="seg seg-float" id="basemapBar" role="group" aria-label="Basemap">
        <button class="seg-btn active" data-basemap="light">Light</button>
        <button class="seg-btn" data-basemap="liberty">Streets</button>
        <button class="seg-btn" data-basemap="satellite">Satellite</button>
      </div>
      <div class="seg seg-float seg-toggles" role="group" aria-label="Layers">
        <button class="seg-btn active" id="btnToggleLogos" title="Company logos on the map">Logos</button>
        <button class="seg-btn active" id="btnToggleSites" title="Operational sites">Sites</button>
        <button class="seg-btn active" id="btnToggleLinks" title="Lines from HQ to sites of the selected company">Lines</button>
        <button class="seg-btn" id="btnToggle3d" title="3D buildings, tilt and rotate">3D</button>
      </div>
      <button class="solo-btn" id="btnSolo" title="Select a company first" disabled>Solo</button>
    </div>

    <div class="detail-sheet" id="inspectorCard"></div>
  </main>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="data/hq_companies_part1.js"></script>
  <script src="data/hq_companies_part2.js"></script>
  <script src="data/hq_companies_spn.js"></script>
  <script src="data/market_quotes.js" defer></script>
  <script src="data/facilities_expansion.js" defer></script>
  <script src="data/facilities_expansion_part2.js" defer></script>
  <script src="data/facilities_expansion_part3.js" defer></script>
  <script src="data/facilities_expansion_part4.js" defer></script>
  <script src="data/facilities_expansion_part5.js" defer></script>
  <script src="data/facilities_expansion_part6.js" defer></script>
  <script src="data/facilities_expansion_part7.js" defer></script>
  <script src="data/facilities_expansion_part8.js" defer></script>
  <script src="data/facilities_agy_batch1.js" defer></script>
  <script src="data/company_intelligence.js" defer></script>
  <script src="data/company_intelligence_part2.js" defer></script>
  <script src="data/company_intelligence_part3.js" defer></script>
  <script src="data/facilities_grok_batch1.js" defer></script>
  <script src="data/facilities_grok_batch2.js" defer></script>
  <script src="data/facilities_grok_batch3.js" defer></script>
  <script src="data/facilities_claude_batch1.js" defer></script>
  <script src="data/facilities_claude_batch2.js" defer></script>
  <script src="data/facilities_claude_deepdive_a1.js" defer></script>
  <script src="data/facilities_claude_deepdive_a2.js" defer></script>
  <script src="data/facilities_claude_deepdive_b.js" defer></script>
  <script src="data/facilities_claude_deepdive_c.js" defer></script>
  <script src="data/facilities_claude_deepdive_d.js" defer></script>
  <script src="data/facilities_claude_deepdive_e.js" defer></script>
  <script src="data/facilities_claude_deepdive_f1.js" defer></script>
  <script src="data/facilities_claude_deepdive_f2.js" defer></script>
  <script src="app.js"></script>
</body>
</html>
