<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="origin" />
  <title>Portfolio Map</title>
  <link rel="dns-prefetch" href="https://tiles.openfreemap.org" />
  <link rel="dns-prefetch" href="https://www.google.com" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="sb-title">
      <a class="brand" href="./" id="brandLink" title="Reload">Portfolio</a>
      <div class="title-right">
        <div class="fund-seg" id="fundBar" role="group" aria-label="Fund">
          <button class="opt active" data-fund="all">All</button>
          <button class="opt" data-fund="SPN" title="Statens pensjonsfond Norge">SPN</button>
          <button class="opt" data-fund="SFT" title="Statens fond i Tromsø">SFT</button>
        </div>
        <button class="reset-btn" id="btnReset" title="Clear search, filters, selection and view">Reset</button>
      </div>
    </div>
    <div class="sb-head">
      <div class="search-wrap">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search"
          aria-label="Search"
          autocomplete="off"
          spellcheck="false"
        />
        <kbd class="search-kbd" id="searchKbd">/</kbd>
        <button class="clear-search" id="btnClearSearch" title="Clear search" hidden>&times;</button>
      </div>
      <button class="filter-btn" id="btnFilter" aria-expanded="false" aria-controls="filterPanel">
        Filter<span class="filter-count" id="filterCount" hidden></span>
      </button>

      <div class="filter-panel" id="filterPanel" hidden>
        <div class="fp-row">
          <span class="fp-label">View</span>
          <div class="opts" id="viewBar">
            <button class="opt active" data-view="companies">List</button>
            <button class="opt" data-view="grid">Logos</button>
            <button class="opt" data-view="facilities">Sites</button>
          </div>
        </div>
        <div class="fp-row">
          <span class="fp-label">Region</span>
          <div class="opts" id="regionBar">
            <button class="opt active" data-region="ALL">All</button>
            <button class="opt" data-region="Norge" title="Norway">NO</button>
            <button class="opt" data-region="Sverige" title="Sweden">SE</button>
            <button class="opt" data-region="Danmark" title="Denmark">DK</button>
            <button class="opt" data-region="Finland" title="Finland">FI</button>
            <button class="opt" data-region="Island" title="Iceland">IS</button>
            <button class="opt" data-region="GLOBAL" title="Sites outside the Nordics">Intl</button>
          </div>
        </div>
        <div class="fp-row">
          <span class="fp-label">Type</span>
          <div class="opts" id="typeBar">
            <button class="opt active" data-type="all">All</button>
            <button class="opt" data-type="hqs_only" title="Headquarters only, no sites">HQs</button>
            <button class="opt" data-type="oilgas">Energy</button>
            <button class="opt" data-type="fish">Seafood</button>
            <button class="opt" data-type="mills">Mining</button>
            <button class="opt" data-type="factories">Factory</button>
            <button class="opt" data-type="datacenters">Data</button>
            <button class="opt" data-type="distribution">Office</button>
            <button class="opt" data-type="pharma">Lab</button>
          </div>
        </div>
      </div>
    </div>

    <div class="list-head">
      <span id="listCount"></span>
      <button class="sort-toggle" id="btnSort" title="Change sort order"></button>
    </div>
    <div class="list-container" id="entityList"></div>
  </aside>

  <main class="map-stage">
    <div id="map"></div>

    <div class="map-toolbar">
      <div class="seg seg-float" id="basemapBar" role="group" aria-label="Basemap">
        <button class="seg-btn active" data-basemap="light">Light</button>
        <button class="seg-btn" data-basemap="liberty">Streets</button>
        <button class="seg-btn" data-basemap="satellite">Satellite</button>
      </div>
      <div class="seg seg-float seg-toggles" role="group" aria-label="Layers">
        <button class="seg-btn active" id="btnToggleLogos" title="Company logos on the map">Logos</button>
        <button class="seg-btn active" id="btnToggleSites" title="Operational sites">Sites</button>
        <button class="seg-btn active" id="btnToggleLinks" title="Lines from HQ to sites of the selected company">Lines</button>
        <button class="seg-btn" id="btnToggle3d" title="3D buildings, tilt and rotate">3D</button>
      </div>
    </div>

    <div class="detail-sheet" id="inspectorCard"></div>
  </main>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="data/hq_companies_part1.js"></script>
